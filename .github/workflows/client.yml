name: Client CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'client/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'client/**'

jobs:
  check-client:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'pnpm'
        cache-dependency-path: './pnpm-lock.yaml'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Run ESLint
      run: pnpm --filter client lint

    - name: Test Build (Verifies Vercel Deployment will succeed)
      run: pnpm --filter client build
